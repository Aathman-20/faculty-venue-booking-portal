name: Faculty Venue Booking Portal CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        working-directory: ./server
        run: npm ci

      - name: Install Python/Selenium dependencies
        run: pip install -r tests/selenium/requirements.txt

      - name: Start backend server
        working-directory: ./server
        env:
          PORT: 3000
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
        run: npm start > ../server.log 2>&1 &
        
      - name: Start frontend server
        run: python -m http.server 8000 &
        
      - name: Wait for services
        run: |
          echo "Waiting for backend on port 3000..."
          for i in {1..30}; do
            curl -s https://faculty-venue-booking-portal.onrender.com//api/venues > /dev/null && break
            sleep 1
          done
          
          if ! curl -s https://faculty-venue-booking-portal.onrender.com//api/venues > /dev/null; then
            echo "Backend failed to become ready."
            echo "========== SERVER LOG =========="
            cat server.log || true
            echo "========== END SERVER LOG =========="
            exit 1
          fi

          echo "Waiting for frontend on port 8000..."
          for i in {1..30}; do
            curl -s http://localhost:8000/login.html > /dev/null && break
            sleep 1
          done
          
          if ! curl -s http://localhost:8000/login.html > /dev/null; then
            echo "Frontend failed to become ready."
            exit 1
          fi

      - name: Run Selenium Tests (Main Suite)
        run: python tests/selenium/test_faculty_venue_portal.py

      - name: Run Novelty Conflict Tests
        run: python test_novelty.py

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-screenshots
          path: |
            *.png
            tests/selenium/*.png
          retention-days: 7
